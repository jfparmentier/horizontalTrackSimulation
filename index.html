<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Montage SVG statique de la simulation du glissement d’un mobile sur un banc horizontal.">
  <title>Simulation du banc horizontal — SVG statique</title>
  <style>
:root {
  color-scheme: light;
  font-family: Inter, ui-rounded, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #eef5f8;
  color: #153247;
}

* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  margin: 0;
  background:
    radial-gradient(circle at 20% 0%, rgba(120, 205, 240, 0.22), transparent 34rem),
    #eef5f8;
}

.page-shell {
  width: min(1440px, calc(100% - 32px));
  margin: 0 auto;
  padding: 28px 0 40px;
}

.page-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
}

.eyebrow {
  margin: 0 0 4px;
  color: #287aa4;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(1.45rem, 2.8vw, 2.25rem);
  line-height: 1.12;
}

.page-subtitle {
  max-width: 50rem;
  margin: 8px 0 0;
  color: #4d6a7e;
  font-size: 0.98rem;
}

.stage-label {
  flex: 0 0 auto;
  padding: 8px 13px;
  border: 1px solid #c1d8e5;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.8);
  color: #356b88;
  font-size: 0.82rem;
  font-weight: 700;
}

.apparatus-card {
  overflow: hidden;
  border: 1px solid rgba(53, 107, 136, 0.22);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 22px 65px rgba(35, 88, 117, 0.13);
}

.apparatus-host {
  width: 100%;
  min-height: 360px;
}

.apparatus-svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1200 / 560;
}

.scene-background {
  fill: #f8fcfe;
  stroke: #d7e8f0;
  stroke-width: 2;
}

.scene-horizon {
  fill: none;
  stroke: #d8e6eb;
  stroke-width: 2;
  stroke-dasharray: 8 12;
}

.phase-badge rect {
  fill: #e5f8ed;
  stroke: #96d6aa;
  stroke-width: 2;
}

.phase-badge circle {
  fill: #35a95c;
}

.phase-badge text {
  fill: #286f43;
  font-size: 18px;
  font-weight: 800;
}

.gravity-badge rect {
  fill: #edf6ff;
  stroke: #a8cae4;
  stroke-width: 2;
}

.gravity-badge text {
  fill: #35647f;
  font-size: 14px;
  font-weight: 700;
}

.gravity-badge .gravity-value {
  font-size: 16px;
  font-weight: 800;
}

.bench-top {
  fill: #8399a7;
  stroke: #536d7c;
  stroke-width: 3;
}

.bench-texture {
  fill: url(#bench-texture);
  opacity: 0.14;
  stroke: none;
}

#bench-texture path {
  stroke: #193f55;
  stroke-width: 1;
  opacity: 0.5;
}

.bench-edge {
  fill: none;
  stroke: #364f5c;
  stroke-width: 5;
  stroke-linecap: round;
}

.bench-leg {
  fill: #587483;
  stroke: #3d5867;
  stroke-width: 3;
  stroke-linejoin: round;
}

.ruler-body {
  fill: #fff8d9;
  stroke: #ceb95d;
  stroke-width: 2;
}

.ruler-tick {
  stroke: #786925;
  stroke-width: 2;
}

.ruler-tick--major {
  stroke-width: 3;
}

.ruler-label,
.ruler-unit,
.origin-label,
.dimension-label,
.caption {
  fill: #365364;
  font-size: 14px;
  font-weight: 700;
}

.ruler-unit {
  font-size: 16px;
}

.origin-mark {
  stroke: #d54c57;
  stroke-width: 4;
  stroke-linecap: round;
}

.origin-label {
  fill: #ac3742;
}

.height-guide {
  stroke: #566f7e;
  stroke-width: 2;
  stroke-dasharray: 7 6;
}

#arrow-head path {
  fill: #566f7e;
}

.sensor {
  cursor: default;
  outline: none;
}

.sensor:focus .sensor-head {
  stroke: #175f86;
  stroke-width: 5;
}

.sensor-beam {
  stroke: #ef666f;
  stroke-width: 3;
  stroke-dasharray: 6 5;
  opacity: 0.65;
}

.sensor-head {
  fill: #f8fbfc;
  stroke: #526d7b;
  stroke-width: 3;
}

.sensor-lens {
  fill: #e94f5c;
}

.sensor-number {
  fill: #375766;
  font-size: 13px;
  font-weight: 900;
}

.pulley-support {
  fill: none;
  stroke: #4d6878;
  stroke-width: 4;
  stroke-linecap: round;
}

.pulley-wheel {
  fill: #d9e4e9;
  stroke: #526b79;
  stroke-width: 4;
}

.pulley-groove {
  fill: none;
  stroke: #8197a3;
  stroke-width: 3;
}

.pulley-hub {
  fill: #405c6c;
}

.string-path {
  fill: none;
  stroke: #2f3c43;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mobile-body {
  fill: url(#mobile-gradient);
  stroke: #176995;
  stroke-width: 4;
}

.mobile-port {
  fill: #2f3c43;
}

.hanging-mass-body {
  fill: url(#mass-gradient);
  stroke: #b95a16;
  stroke-width: 4;
}

.object-label {
  fill: #ffffff;
  font-size: 22px;
  font-weight: 900;
  paint-order: stroke;
  stroke: rgba(0, 0, 0, 0.12);
  stroke-width: 4;
}

.socle-top {
  fill: #899ca7;
  stroke: #526b79;
  stroke-width: 3;
}

.socle-base {
  fill: #687f8c;
  stroke: #526b79;
  stroke-width: 3;
}

.height-label {
  fill: #496675;
}

.caption {
  fill: #6c8390;
  font-size: 13px;
  font-weight: 600;
}

@media (max-width: 760px) {
  .page-shell {
    width: min(100% - 16px, 1440px);
    padding-top: 16px;
  }

  .page-header {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .apparatus-card {
    border-radius: 16px;
    overflow-x: auto;
  }

  .apparatus-host {
    min-width: 900px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
  }
}

  </style>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Simulation de mécanique</p>
        <h1>Glissement d’un mobile sur un banc horizontal</h1>
        <p class="page-subtitle">Montage initial entièrement dessiné en SVG, avec huit capteurs positionnés par défaut.</p>
      </div>
      <span class="stage-label">Étape 4 · montage statique</span>
    </header>

    <section class="apparatus-card" aria-label="Aperçu du montage expérimental">
      <div id="apparatus-host" class="apparatus-host">
<svg id="apparatus-svg" class="apparatus-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="apparatus-title apparatus-description" preserveAspectRatio="xMidYMid meet">
    <title id="apparatus-title">Montage du banc horizontal</title>
    <desc id="apparatus-description">Montage initial avec le mobile S1 sur un banc horizontal, la masse S2 suspendue par un fil passant sur une poulie, 8 capteurs régulièrement répartis et un support de réception sous S2.</desc>

    <defs>
      <linearGradient id="mobile-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#83d7ff" />
        <stop offset="1" stop-color="#278fc4" />
      </linearGradient>
      <linearGradient id="mass-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffbf69" />
        <stop offset="1" stop-color="#e57a22" />
      </linearGradient>
      <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.2" />
      </filter>
      <marker id="arrow-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" />
      </marker>
      <pattern id="bench-texture" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M 0 16 L 16 0" />
      </pattern>
    </defs>

    <g id="layer-background" aria-hidden="true">
      <rect class="scene-background" x="16" y="16" width="1168" height="528" rx="28" />
    </g>

    <g id="layer-status" aria-label="État initial">
      <g class="gravity-badge" transform="translate(946 48)">
        <rect width="188" height="50" rx="14" />
        <text x="94" y="22" text-anchor="middle">Gravité</text>
        <text class="gravity-value" x="94" y="40" text-anchor="middle">Terre</text>
      </g>
    </g>

    <g id="layer-track" data-role="track">
      <rect class="bench-top" x="98" y="306" width="838" height="46" rx="8" />
      <rect class="bench-texture" x="98" y="313" width="838" height="32" rx="5" />
      <path class="bench-edge" d="M 98 352 H 936" />
      <path class="bench-leg" d="M 188 352 L 170 445 H 250 L 232 352" />
      <path class="bench-leg" d="M 804 352 L 786 445 H 866 L 848 352" />
    </g>

    
    <g id="layer-ruler" data-role="ruler" aria-label="Règle graduée">
      <rect class="ruler-body" x="98" y="366" width="838" height="48" rx="8" />
      
        <line class="ruler-tick ruler-tick--major" x1="98" y1="366" x2="98" y2="382" />
        <text class="ruler-label" x="98" y="405" text-anchor="middle">0.0</text>
        <line class="ruler-tick" x1="181.8" y1="366" x2="181.8" y2="376" />
        
        <line class="ruler-tick" x1="265.6" y1="366" x2="265.6" y2="376" />
        <text class="ruler-label" x="265.6" y="405" text-anchor="middle">0.4</text>
        <line class="ruler-tick" x1="349.4" y1="366" x2="349.4" y2="376" />
        
        <line class="ruler-tick" x1="433.20000000000005" y1="366" x2="433.20000000000005" y2="376" />
        <text class="ruler-label" x="433.20000000000005" y="405" text-anchor="middle">0.8</text>
        <line class="ruler-tick ruler-tick--major" x1="517" y1="366" x2="517" y2="382" />
        
        <line class="ruler-tick" x1="600.8" y1="366" x2="600.8" y2="376" />
        <text class="ruler-label" x="600.8" y="405" text-anchor="middle">1.2</text>
        <line class="ruler-tick" x1="684.5999999999999" y1="366" x2="684.5999999999999" y2="376" />
        
        <line class="ruler-tick" x1="768.4000000000001" y1="366" x2="768.4000000000001" y2="376" />
        <text class="ruler-label" x="768.4000000000001" y="405" text-anchor="middle">1.6</text>
        <line class="ruler-tick" x1="852.2" y1="366" x2="852.2" y2="376" />
        
        <line class="ruler-tick ruler-tick--major" x1="936" y1="366" x2="936" y2="382" />
        <text class="ruler-label" x="936" y="405" text-anchor="middle">2.0</text>
      <text class="ruler-unit" x="954" y="405">m</text>
    </g>

    <g id="layer-sensors" aria-label="8 capteurs de vitesse">
      
      <g id="sensor-1" class="sensor" data-role="sensor" data-sensor-id="1" data-position="0.2222222222222222" transform="translate(191.1111111111111 0)" tabindex="0" role="img" aria-label="Capteur 1, position 0,22 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">1</text>
      </g>
      <g id="sensor-2" class="sensor" data-role="sensor" data-sensor-id="2" data-position="0.4444444444444444" transform="translate(284.2222222222222 0)" tabindex="0" role="img" aria-label="Capteur 2, position 0,44 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">2</text>
      </g>
      <g id="sensor-3" class="sensor" data-role="sensor" data-sensor-id="3" data-position="0.6666666666666666" transform="translate(377.3333333333333 0)" tabindex="0" role="img" aria-label="Capteur 3, position 0,67 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">3</text>
      </g>
      <g id="sensor-4" class="sensor" data-role="sensor" data-sensor-id="4" data-position="0.8888888888888888" transform="translate(470.4444444444444 0)" tabindex="0" role="img" aria-label="Capteur 4, position 0,89 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">4</text>
      </g>
      <g id="sensor-5" class="sensor" data-role="sensor" data-sensor-id="5" data-position="1.1111111111111112" transform="translate(563.5555555555557 0)" tabindex="0" role="img" aria-label="Capteur 5, position 1,11 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">5</text>
      </g>
      <g id="sensor-6" class="sensor" data-role="sensor" data-sensor-id="6" data-position="1.3333333333333333" transform="translate(656.6666666666666 0)" tabindex="0" role="img" aria-label="Capteur 6, position 1,33 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">6</text>
      </g>
      <g id="sensor-7" class="sensor" data-role="sensor" data-sensor-id="7" data-position="1.5555555555555556" transform="translate(749.7777777777778 0)" tabindex="0" role="img" aria-label="Capteur 7, position 1,56 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">7</text>
      </g>
      <g id="sensor-8" class="sensor" data-role="sensor" data-sensor-id="8" data-position="1.7777777777777777" transform="translate(842.8888888888888 0)" tabindex="0" role="img" aria-label="Capteur 8, position 1,78 mètre">
        <line class="sensor-beam" x1="0" y1="200" x2="0" y2="302" />
        <rect class="sensor-head" x="-16" y="178" width="32" height="22" rx="7" />
        <circle class="sensor-lens" cx="-7" cy="189" r="4" />
        <text class="sensor-number" x="7" y="193" text-anchor="middle">8</text>
      </g>
    </g>

    <g id="layer-pulley" data-role="pulley">
      <line class="pulley-support" x1="936" y1="306" x2="1016" y2="260" />
      <circle class="pulley-wheel" cx="1016" cy="260" r="20" />
      <circle class="pulley-groove" cx="1016" cy="260" r="13" />
      <circle class="pulley-hub" cx="1016" cy="260" r="5" />
    </g>

    <g id="layer-string" data-role="string" aria-label="Fil tendu">
      <path id="string-path" class="string-path" data-role="string-path" d="M 210 240
    L 1016 240
    A 20 20 0 0 1 1036 260
    L 1036 292" />
    </g>

    <g id="layer-mobile" data-role="mobile" transform="translate(98 228)">
      <rect id="mobile-body" class="mobile-body" data-role="mobile-body" x="0" y="0" width="112" height="74" rx="18" />
      <circle class="mobile-port" cx="112" cy="12" r="5" />
      <text class="object-label" x="56" y="44" text-anchor="middle">S1</text>
    </g>

    <g id="layer-hanging-mass" data-role="hanging-mass" transform="translate(998 292)">
      <rect id="hanging-mass-body" class="hanging-mass-body" data-role="hanging-mass-body" x="0" y="0" width="76" height="76" rx="14" />
      <text class="object-label" x="38" y="50" text-anchor="middle">S2</text>
    </g>

    <g id="layer-socle" data-role="socle">
      <rect class="socle-top" x="964" y="462" width="144" height="28" rx="8" />
      <path class="socle-base" d="M 978 490 H 1094 L 1110 520 H 962 Z" />
    </g>

    <g id="layer-height-guide" aria-label="Hauteur de chute 0,5 mètre">
      <line class="height-guide" x1="1138" y1="368" x2="1138" y2="462" marker-start="url(#arrow-head)" marker-end="url(#arrow-head)" />
      <text class="dimension-label height-label" x="1152" y="415" text-anchor="middle" transform="rotate(-90 1152 415)">0.5 m</text>
    </g>

  </svg>
      </div>
    </section>
  </main>
</body>
</html>
